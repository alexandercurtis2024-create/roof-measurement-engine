name: catalog-test
on:
  push:
    paths:
      - services/lidar-worker/lidar_catalog.py
      - services/lidar-worker/test_lidar_catalog.py
      - .github/workflows/catalog-test.yml
  workflow_dispatch:
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python services/lidar-worker/test_lidar_catalog.py
