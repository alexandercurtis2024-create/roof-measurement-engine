name: lidar-job
on:
  repository_dispatch:
    types: [lidar-job]
  workflow_dispatch:
    inputs:
      jobId:
        description: Measurement job id
        required: true
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install --quiet numpy scipy shapely pyproj laspy lazrs rasterio
      - name: run frozen engine
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          JOB_ID: ${{ github.event.client_payload.jobId || inputs.jobId }}
        run: |
          if [ -z "$JOB_ID" ]; then echo missing job id; exit 1; fi
          if [ -z "$APP_BASE_URL" ] || [ -z "$WORKER_SECRET" ]; then echo missing secrets; exit 1; fi
          cd services/lidar-worker
          python worker.py "$JOB_ID"
      - name: fail job if worker died
        if: failure()
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          JOB_ID: ${{ github.event.client_payload.jobId || inputs.jobId }}
        run: |
          python - << 'PY'
          import json, os, urllib.request
          base, secret, job = os.environ.get("APP_BASE_URL"), os.environ.get("WORKER_SECRET"), os.environ.get("JOB_ID")
          if not base or not secret or not job:
              print("cannot fail job; secrets missing")
              raise SystemExit(0)
          req = urllib.request.Request(base.rstrip("/") + f"/api/measurement-jobs/{job}/fail", data=json.dumps({"error": "worker died before callback"}).encode(), method="POST", headers={"Authorization": f"Bearer {secret}", "Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30).read()
          print("failed job", job)
          PY
